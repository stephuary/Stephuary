<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stephuary Diagnostic</title>
  <style>
    :root {
      --bg: #0a0a1a;
      --surface: rgba(255, 255, 255, 0.03);
      --surface-2: rgba(255, 255, 255, 0.05);
      --line: rgba(255, 255, 255, 0.12);
      --text: #ffffff;
      --text-muted: #a0a0b0;
      --gold: #c8a96e;
      --gold-soft: rgba(200, 169, 110, 0.18);
      --ok: #88d39c;
      --danger: #dc2626;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      color: var(--text);
      background:
        radial-gradient(120% 70% at 20% 0%, rgba(61, 12, 44, 0.28) 0%, transparent 60%),
        radial-gradient(110% 80% at 90% 85%, rgba(61, 12, 44, 0.2) 0%, transparent 58%),
        linear-gradient(180deg, #0a0a1a 0%, #0f0b1c 100%);
      display: grid;
      place-items: center;
      padding: 20px;
    }

    .app {
      width: 100%;
      max-width: 760px;
      border: 1px solid var(--line);
      background: var(--surface);
      backdrop-filter: blur(6px);
      border-radius: 16px;
      padding: 24px;
      transform: translateY(0);
      opacity: 1;
      transition: opacity 240ms ease, transform 240ms ease;
    }
    .back-home {
      position: fixed;
      top: 16px;
      left: 16px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 8px 12px;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      font-size: 12px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-muted);
      text-decoration: none;
      background: rgba(10, 10, 26, 0.72);
      backdrop-filter: blur(6px);
      transition: color 180ms ease, border-color 180ms ease, background 180ms ease;
    }
    .back-home::before {
      content: "←";
      font-size: 13px;
      line-height: 1;
    }
    .back-home:hover {
      color: var(--text);
      border-color: rgba(200, 169, 110, 0.45);
      background: rgba(200, 169, 110, 0.08);
    }

    .app.is-transitioning {
      opacity: 0;
      transform: translateY(10px);
    }

    .progress {
      font-size: 12px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 18px;
    }

    .question {
      font-family: "Playfair Display", Georgia, serif;
      font-size: clamp(28px, 4vw, 40px);
      line-height: 1.15;
      margin: 0 0 20px;
      letter-spacing: -0.01em;
    }

    .answers {
      display: grid;
      gap: 12px;
    }

    .answer-btn {
      width: 100%;
      text-align: left;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--surface);
      color: var(--text);
      padding: 18px 16px;
      font-size: 16px;
      line-height: 1.45;
      cursor: pointer;
      transition: border-color 180ms ease, background 180ms ease, transform 180ms ease;
      min-height: 64px;
    }

    .answer-btn:hover {
      border-color: rgba(200, 169, 110, 0.5);
      background: var(--surface-2);
    }

    .answer-btn:active { transform: translateY(1px); }

    .answer-btn.is-selected {
      border-color: var(--gold);
      background: var(--gold-soft);
    }

    .answer-btn.is-locked { pointer-events: none; opacity: 0.65; }

    .feedback {
      margin-top: 14px;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-left: 3px solid var(--gold);
      border-radius: 10px;
      color: var(--text-muted);
      font-size: 14px;
      line-height: 1.5;
      background: rgba(255, 255, 255, 0.02);
      display: none;
    }

    .feedback.is-visible { display: block; }
    .feedback.good { border-left-color: var(--ok); }
    .feedback.warn { border-left-color: var(--danger); }

    .interstitial,
    .analyzing {
      text-align: center;
      padding: 42px 14px;
    }

    .interstitial-tag,
    .analyzing-tag {
      font-size: 11px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 10px;
    }

    .interstitial-copy,
    .analyzing-copy {
      font-family: "Playfair Display", Georgia, serif;
      font-size: clamp(26px, 4vw, 34px);
      line-height: 1.2;
      margin: 0;
      color: var(--text);
    }

    @media (max-width: 768px) {
      .app { padding: 20px; }
      .answers { gap: 10px; }
      .answer-btn { padding: 16px 14px; }
      .back-home {
        top: 12px;
        left: 12px;
        padding: 7px 11px;
        font-size: 11px;
      }
    }
  </style>
</head>
<body>
  <a href="/" class="back-home">Homepage</a>
  <main class="app" id="app" aria-live="polite"></main>

  <script>
    const QUESTIONS = [
      {
        id: 1,
        text:
          "Can someone understand what you do, who it's for, and why it's worth the price in under 10 seconds?"
      },
      {
        id: 2,
        text: "At what exact step are your last 3 deals falling apart?"
      },
      {
        id: 3,
        text: "Can a buyer explain why you're the better choice without you being there to explain it?"
      },
      {
        id: 4,
        text: "Do your last 5 leads match the work you want to be paid for?"
      },
      {
        id: 5,
        text: "Is your delivery process the same every time, without needing to figure it out again?"
      },
      {
        id: 6,
        text: "If you step away for a week, does work continue without delays or drop in quality?"
      },
      {
        id: 7,
        text: "Does your price make sense before you explain it?"
      }
    ];

    const ANSWER_ORDER = [
      { key: "yes", label: "Yes" },
      { key: "not_sure", label: "Not sure" },
      { key: "no", label: "No" }
    ];

    const POINTS = { yes: 2, not_sure: 1, no: 0 };

    let currentIndex = 0;
    const answers = [];

    const app = document.getElementById("app");

    function transition(callback, delay) {
      const ms = delay == null ? 120 : delay;
      app.classList.add("is-transitioning");
      window.setTimeout(() => {
        callback();
        app.classList.remove("is-transitioning");
      }, ms);
    }

    function countNo(ids, byId) {
      return ids.filter(function (id) {
        return byId[id] === "no";
      }).length;
    }

    function answersById() {
      const m = {};
      answers.forEach(function (a) {
        m[a.id] = a.value;
      });
      return m;
    }

    function resultTypeFromTotal(total) {
      if (total <= 4) return "Breakdown";
      if (total <= 8) return "Misalignment";
      if (total <= 11) return "Constraint";
      return "Ceiling";
    }

    function diagnosisLine(type, noEarly, noLate) {
      const earlyHeavy = noEarly >= noLate;
      if (type === "Breakdown") {
        return earlyHeavy
          ? "Your offer requires explanation before it makes sense."
          : "Your structure depends on you to function.";
      }
      if (type === "Misalignment") {
        return earlyHeavy
          ? "Your deals break at the point of comparison."
          : "Your leads do not match the work you want paid for.";
      }
      if (type === "Constraint") {
        return earlyHeavy
          ? "Buyers still need you in the room to explain the edge."
          : "Delivery varies because the steps live in your head.";
      }
      return "You are maxed on effort before the next revenue tier.";
    }

    function routeKey(noEarly, noLate) {
      if (noEarly >= 3 && noLate < 3) return "report27";
      if (noLate >= 3 && noEarly < 3) return "snapshot950";
      return "mixed";
    }

    function routeMessage(key) {
      if (key === "report27") return "Fix how your offer explains itself before price comes up.";
      if (key === "snapshot950") return "Your structure is limiting revenue and consistency.";
      return "You are solving problems manually instead of structurally.";
    }

    function firstMoveFromRoute(key) {
      if (key === "report27") return "Rewrite your offer so it makes sense without explanation.";
      if (key === "snapshot950") return "Map your delivery steps and remove variation.";
      return "Rewrite your offer so it makes sense without explanation.";
    }

    function buildPayload() {
      const byId = answersById();
      const points = answers.map(function (a) {
        return POINTS[a.value];
      });
      const totalScore = points.reduce(function (s, n) {
        return s + n;
      }, 0);
      const noEarly = countNo([1, 2, 3], byId);
      const noLate = countNo([4, 5, 6, 7], byId);
      const resultType = resultTypeFromTotal(totalScore);
      const route = routeKey(noEarly, noLate);
      const diagnosis = diagnosisLine(resultType, noEarly, noLate);
      const firstMove = firstMoveFromRoute(route);
      const msg = routeMessage(route);
      const scores = {
        clarity: [1, 2, 7].filter(function (id) {
          return byId[id] === "no";
        }).length,
        positioning: [3, 4].filter(function (id) {
          return byId[id] === "no";
        }).length,
        structure: [5, 6].filter(function (id) {
          return byId[id] === "no";
        }).length
      };
      return {
        schema: "diag_v2",
        version: 2,
        answers: answers.slice(),
        points: points,
        totalScore: totalScore,
        resultType: resultType,
        diagnosisLine: diagnosis,
        firstMove: firstMove,
        routeMessage: msg,
        route: route,
        noCountEarly: noEarly,
        noCountLate: noLate,
        scores: scores,
        result: {
          headline: diagnosis,
          nextStep: firstMove
        }
      };
    }

    function renderQuestion() {
      const q = QUESTIONS[currentIndex];
      const n = currentIndex + 1;
      const btns = ANSWER_ORDER.map(function (opt) {
        return (
          '<button type="button" class="answer-btn" data-value="' +
          opt.key +
          '">' +
          opt.label +
          "</button>"
        );
      }).join("");
      app.innerHTML =
        '<div class="progress">Question ' +
        n +
        " of 7</div>" +
        '<h1 class="question">' +
        q.text +
        "</h1>" +
        '<div class="answers">' +
        btns +
        "</div>";

      Array.prototype.forEach.call(app.querySelectorAll(".answer-btn"), function (btn) {
        btn.addEventListener("click", function () {
          if (btn.classList.contains("is-locked")) return;
          const value = btn.getAttribute("data-value");
          Array.prototype.forEach.call(app.querySelectorAll(".answer-btn"), function (b) {
            b.classList.add("is-locked");
            b.classList.remove("is-selected");
          });
          btn.classList.add("is-selected");
          answers.push({ id: q.id, value: value });
          currentIndex++;
          if (currentIndex < QUESTIONS.length) {
            transition(renderQuestion, 100);
          } else {
            renderAnalyzing();
          }
        });
      });
    }

    function renderAnalyzing() {
      transition(function () {
        app.innerHTML =
          '<section class="analyzing">' +
          '<div class="analyzing-tag">Result</div>' +
          '<p class="analyzing-copy">Locking in your read.</p>' +
          "</section>";
      }, 100);
      window.setTimeout(function () {
        const payload = buildPayload();
        try {
          localStorage.setItem("diagnosticResults", JSON.stringify(payload));
        } catch (e) {}
        window.location.href = "/results";
      }, 420);
    }

    renderQuestion();
  </script>
</body>
</html>
