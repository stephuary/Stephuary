  <style>
    :root {
      --bg: #05050f;
      --surface: rgba(255, 255, 255, 0.04);
      --surface-2: rgba(255, 255, 255, 0.08);
      --line: rgba(255, 255, 255, 0.14);
      --text: #ffffff;
      --text-muted: #a0a0c0;
      --gold: #c8a96e;
      --gold-soft: rgba(200, 169, 110, 0.22);
      --ok: #88d39c;
      --danger: #dc2626;
      --max: 40rem;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: 'Inter', system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      color: var(--text);
      background: var(--bg);
      /* Canonical sitewide atmosphere — mirrors homepage. */
      background-image:
        radial-gradient(ellipse 80% 60% at 50% 0%,   rgba(61, 12, 44, 1)     0%, transparent 60%),
        radial-gradient(ellipse 60% 40% at 20% 100%, rgba(61, 12, 44, 0.6)   0%, transparent 50%),
        radial-gradient(ellipse 50% 40% at 80% 60%,  rgba(139, 47, 201, 0.12) 0%, transparent 50%);
      display: grid;
      place-items: center;
      padding: 14px;
    }

    .app {
      width: 100%;
      max-width: var(--max);
      border: 1px solid var(--line);
      background: var(--surface);
      backdrop-filter: blur(6px);
      border-radius: 14px;
      padding: 18px 18px 20px;
      transform: translateY(0);
      opacity: 1;
      transition: opacity 90ms ease, transform 90ms ease;
    }
    .back-home {
      position: fixed;
      top: 16px;
      left: 16px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 8px 12px;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      font-size: 12px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-muted);
      text-decoration: none;
      background: rgba(10, 10, 26, 0.72);
      backdrop-filter: blur(6px);
      transition: color 120ms ease, border-color 120ms ease, background 120ms ease;
    }
    .back-home::before {
      content: "←";
      font-size: 13px;
      line-height: 1;
    }
    .back-home:hover {
      color: var(--text);
      border-color: rgba(200, 169, 110, 0.45);
      background: rgba(200, 169, 110, 0.08);
    }

    .app.is-transitioning {
      opacity: 0.35;
      transform: translateY(4px);
    }

    .capture-layout {
      display: flex;
      flex-direction: column;
      max-width: 36rem;
      margin: 0 auto;
    }

    .capture-save-reassure {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      line-height: 1.45;
      color: var(--text-muted);
      margin: 0 0 14px;
    }
    .capture-save-reassure__dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--ok, #88d39c);
      flex: 0 0 auto;
      box-shadow: 0 0 0 3px rgba(136, 211, 156, 0.15);
    }
    .capture-save-reassure__text strong {
      color: var(--text);
      font-weight: 600;
    }

    .capture-progress-meta {
      font-size: 11px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--text-muted);
      font-weight: 600;
      margin-bottom: 8px;
    }

    .capture-progress-track {
      height: 4px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.1);
      overflow: hidden;
      margin-bottom: 14px;
    }

    .capture-progress-fill {
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--gold), #e8d4a8);
      transition: width 0.2s ease;
    }

    .capture-question-zone {
      flex: 1;
      display: flex;
      align-items: center;
      margin: 4px 0 14px;
    }

    .question {
      font-family: "Playfair Display", Georgia, serif;
      font-size: clamp(1.35rem, 4.2vw, 1.85rem);
      font-weight: 700;
      line-height: 1.18;
      margin: 0;
      letter-spacing: -0.02em;
    }

    .answers {
      display: grid;
      gap: 10px;
    }

    .answer-btn {
      width: 100%;
      text-align: left;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.03);
      color: var(--text);
      padding: 16px 18px;
      font-size: 16px;
      font-weight: 600;
      line-height: 1.35;
      cursor: pointer;
      min-height: 56px;
    }

    .answer-btn:hover {
      background: var(--surface-2);
    }

    .answer-btn.is-selected {
      border-color: var(--gold);
      background: var(--gold-soft);
      box-shadow: 0 0 0 1px rgba(212, 184, 122, 0.35);
      position: relative;
    }

    .answer-btn[disabled],
    .answer-btn.is-locked {
      pointer-events: none;
      opacity: 0.55;
      cursor: default;
    }

    .answer-btn.is-selected[disabled],
    .answer-btn.is-selected.is-locked {
      opacity: 1;
    }

    .answer-btn.is-pending::after {
      content: "";
      position: absolute;
      right: 16px;
      top: 50%;
      width: 14px;
      height: 14px;
      margin-top: -7px;
      border-radius: 50%;
      border: 2px solid rgba(212, 184, 122, 0.35);
      border-top-color: var(--gold);
      animation: capture-spin 620ms linear infinite;
    }

    .answer-btn.is-pending {
      animation: capture-pulse 900ms ease-in-out infinite;
    }

    @keyframes capture-spin {
      to { transform: rotate(360deg); }
    }

    @keyframes capture-pulse {
      0%, 100% { box-shadow: 0 0 0 1px rgba(212, 184, 122, 0.35); }
      50%      { box-shadow: 0 0 0 1px rgba(212, 184, 122, 0.65), 0 0 0 6px rgba(212, 184, 122, 0.08); }
    }

    @media (prefers-reduced-motion: reduce) {
      .answer-btn.is-pending { animation: none; }
      .answer-btn.is-pending::after { animation: none; border-top-color: var(--gold); }
    }

    .feedback {
      margin-top: 14px;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-left: 3px solid var(--gold);
      border-radius: 10px;
      color: var(--text-muted);
      font-size: 14px;
      line-height: 1.5;
      background: rgba(255, 255, 255, 0.02);
      display: none;
    }

    .feedback.is-visible { display: block; }
    .feedback.good { border-left-color: var(--ok); }
    .feedback.warn { border-left-color: var(--danger); }

    .interstitial,
    .analyzing {
      text-align: center;
      padding: 28px 14px;
    }

    .interstitial-tag,
    .analyzing-tag {
      font-size: 11px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 10px;
    }

    .interstitial-copy,
    .analyzing-copy {
      font-family: "Playfair Display", Georgia, serif;
      font-size: clamp(26px, 4vw, 34px);
      line-height: 1.2;
      margin: 0;
      color: var(--text);
    }

    .analyzing-fallback {
      margin: 18px 0 0;
      font-size: 13px;
      letter-spacing: 0.04em;
      color: var(--text-muted);
    }
    .analyzing-fallback a {
      color: var(--gold);
      text-decoration: none;
      border-bottom: 1px solid rgba(200, 169, 110, 0.35);
      padding-bottom: 1px;
    }
    .analyzing-fallback a:hover,
    .analyzing-fallback a:focus-visible {
      color: #e8d4a8;
      border-bottom-color: rgba(232, 212, 168, 0.7);
    }

    @media (max-width: 768px) {
      .app { padding: 16px 14px 18px; }
      .answers { gap: 8px; }
      .answer-btn {
        padding: 15px 16px;
        min-height: 52px;
      }
      .back-home {
        top: 12px;
        left: 12px;
        padding: 7px 11px;
        font-size: 11px;
      }
    }
  </style>
</head>
<body class="capture-page">
  <a href="#main" class="skip-link">Skip to content</a>
  <nav class="site-nav" aria-label="Primary">
    <div class="site-nav__brand">
      <a href="/" class="site-nav__wordmark" aria-label="Stephuary — home"><img src="/stephuary-mark.svg" alt="" class="site-nav__mark" width="28" height="28" decoding="async" />Stephuary</a>
    </div>
    <ul class="site-nav__list">
      <li><a href="/pricing" class="site-nav__link">Pricing</a></li>
      <li><a href="/access" class="site-nav__link">Access</a></li>
      <li><a href="/capture" class="site-nav__link" aria-current="page">Diagnostic</a></li>
    </ul>
  </nav>
  <main class="app" id="main" aria-live="polite"></main>

  <!-- Minimal footer — diagnostic flow keeps chrome out of the user's way. -->
  <footer class="sh-footer" role="contentinfo" aria-labelledby="sh-foot-mark">
    <div class="sh-footer__inner">
      <a class="sh-footer__mark" id="sh-foot-mark" href="/" aria-label="Stephuary home">Stephuary</a>
      <p class="sh-footer__copy">© 2026 Stephuary · All rights reserved</p>
      <div class="site-footer__legal" aria-label="Legal and contact">
        <a href="/privacy">Privacy</a>
        <span aria-hidden="true">·</span>
        <a href="/terms">Terms</a>
        <span aria-hidden="true">·</span>
        <a href="mailto:hello@stephuary.com">hello@stephuary.com</a>
      </div>
    </div>
  </footer>

  <script>
    const QUESTIONS = [
      {
        id: 1,
        text:
          "Can someone understand what you do, who it's for, and why it's worth the price in under 10 seconds?"
      },
      {
        id: 2,
        text: "At what exact step are your last 3 deals falling apart?"
      },
      {
        id: 3,
        text: "Can a buyer explain why you're the better choice without you being there to explain it?"
      },
      {
        id: 4,
        text: "Do your last 5 leads match the work you want to be paid for?"
      },
      {
        id: 5,
        text: "Is your delivery process the same every time, without needing to figure it out again?"
      },
      {
        id: 6,
        text: "If you step away for a week, does work continue without delays or drop in quality?"
      },
      {
        id: 7,
        text: "Does your price make sense before you explain it?"
      }
    ];

    const ANSWER_ORDER = [
      { key: "yes", label: "Yes" },
      { key: "not_sure", label: "Not sure" },
      { key: "no", label: "No" }
    ];

    const POINTS = { yes: 2, not_sure: 1, no: 0 };

    const PROGRESS_KEY = "stephuary_diag_progress_v1";

    let currentIndex = 0;
    let answers = [];

    function loadSavedProgress() {
      try {
        const raw = localStorage.getItem(PROGRESS_KEY);
        if (!raw) return null;
        const parsed = JSON.parse(raw);
        if (
          !parsed ||
          typeof parsed !== "object" ||
          !Array.isArray(parsed.answers) ||
          typeof parsed.currentIndex !== "number"
        ) {
          return null;
        }
        const valid = parsed.answers.every(function (a) {
          return (
            a &&
            typeof a.id === "number" &&
            a.id >= 1 &&
            a.id <= QUESTIONS.length &&
            (a.value === "yes" || a.value === "no" || a.value === "not_sure")
          );
        });
        if (!valid) return null;
        const idx = Math.max(0, Math.min(QUESTIONS.length, parsed.currentIndex));
        if (idx >= QUESTIONS.length) return null;
        return { currentIndex: idx, answers: parsed.answers.slice(0, idx) };
      } catch (e) {
        return null;
      }
    }

    function saveProgress() {
      try {
        localStorage.setItem(
          PROGRESS_KEY,
          JSON.stringify({ currentIndex: currentIndex, answers: answers })
        );
      } catch (e) {}
    }

    function clearProgress() {
      try {
        localStorage.removeItem(PROGRESS_KEY);
      } catch (e) {}
    }

    (function restoreProgress() {
      const saved = loadSavedProgress();
      if (saved) {
        answers = saved.answers.slice();
        currentIndex = saved.currentIndex;
      }
    })();

    const app = document.getElementById("main");

    function transition(callback, delay) {
      const ms = delay == null ? 165 : delay;
      app.classList.add("is-transitioning");
      window.setTimeout(() => {
        callback();
        app.classList.remove("is-transitioning");
      }, ms);
    }

    function answersById() {
      const m = {};
      answers.forEach(function (a) {
        m[a.id] = a.value;
      });
      return m;
    }

    function resultTypeFromTotal(total) {
      if (total <= 4) return "Breakdown";
      if (total <= 8) return "Misalignment";
      if (total <= 11) return "Constraint";
      return "Ceiling";
    }

    function buildPayload() {
      const byId = answersById();
      const points = answers.map(function (a) {
        return POINTS[a.value];
      });
      const totalScore = points.reduce(function (s, n) {
        return s + n;
      }, 0);
      const resultType = resultTypeFromTotal(totalScore);
      const scores = {
        clarity: [1, 2, 7].filter(function (id) {
          return byId[id] === "no";
        }).length,
        positioning: [3, 4].filter(function (id) {
          return byId[id] === "no";
        }).length,
        structure: [5, 6].filter(function (id) {
          return byId[id] === "no";
        }).length
      };
      return {
        schema: "diag_v2",
        version: 2,
        answers: answers.slice(),
        points: points,
        totalScore: totalScore,
        resultType: resultType,
        scores: scores,
        result: {
          headline: "",
          nextStep: ""
        }
      };
    }

    function renderQuestion() {
      const q = QUESTIONS[currentIndex];
      const n = currentIndex + 1;
      const pct = Math.round((100 * n) / 7);
      const btns = ANSWER_ORDER.map(function (opt) {
        return (
          '<button type="button" class="answer-btn" data-value="' +
          opt.key +
          '">' +
          opt.label +
          "</button>"
        );
      }).join("");
      const reassure =
        currentIndex === 0
          ? '<p class="diag-reassure">No account needed. No signup before your result.</p>'
          : "";
      app.innerHTML =
        '<div class="capture-layout">' +
        '<p class="capture-save-reassure" role="status">' +
        '<span class="capture-save-reassure__dot" aria-hidden="true"></span>' +
        '<span class="capture-save-reassure__text"><strong>Your progress saves automatically.</strong> Come back any time.</span>' +
        '</p>' +
        '<div class="diag-progress" aria-live="polite">' +
        '<span class="diag-progress__count" data-diag-progress-count>' +
        n +
        " of 7</span>" +
        '<div class="diag-progress__bar" role="progressbar" aria-valuemin="0" aria-valuemax="7" aria-valuenow="' +
        n +
        '" aria-valuetext="Question ' +
        n +
        ' of 7">' +
        '<div class="diag-progress__fill" data-diag-progress-fill style="width:' +
        pct +
        '%"></div></div></div>' +
        reassure +
        '<div class="capture-question-zone"><h1 class="question">' +
        q.text +
        "</h1></div>" +
        '<div class="answers" role="group" aria-label="Answer options">' +
        btns +
        "</div></div>";
      const layout = app.querySelector(".capture-layout");
      if (layout) {
        layout.classList.remove("sh-motion-q-enter");
        void layout.offsetWidth;
        requestAnimationFrame(function () {
          layout.classList.add("sh-motion-q-enter");
        });
      }

      Array.prototype.forEach.call(app.querySelectorAll(".answer-btn"), function (btn) {
        btn.addEventListener("click", function () {
          if (btn.disabled || btn.classList.contains("is-locked")) return;
          const value = btn.getAttribute("data-value");
          Array.prototype.forEach.call(app.querySelectorAll(".answer-btn"), function (b) {
            b.disabled = true;
            b.setAttribute("aria-disabled", "true");
            b.classList.add("is-locked");
            b.classList.remove("is-selected");
          });
          btn.classList.add("is-selected", "is-pending");
          answers.push({ id: q.id, value: value });
          currentIndex++;
          saveProgress();
          window.setTimeout(function () {
            if (currentIndex < QUESTIONS.length) {
              transition(renderQuestion, 32);
            } else {
              renderAnalyzing();
            }
          }, 180);
        });
      });
    }

    function renderAnalyzing() {
      /* Persist the read immediately so we never depend on a timer firing
         before the redirect. Track whether the payload actually landed in
         localStorage so the fallback link points somewhere useful. If the
         write failed, sending the user to /results would dead-end them on
         the state-missing card. Restart is the honest fallback. */
      var persisted = false;
      try {
        var payload = buildPayload();
        try {
          localStorage.setItem("diagnosticResults", JSON.stringify(payload));
          persisted = localStorage.getItem("diagnosticResults") != null;
        } catch (eLs) {}
      } catch (ePl) {}
      try { clearProgress(); } catch (eCp) {}

      var fallbackHref = persisted ? "/results" : "/capture";
      var fallbackLabel = persisted
        ? "Continue to your read &rarr;"
        : "Restart the diagnostic &rarr;";

      transition(function () {
        app.innerHTML =
          '<section class="analyzing">' +
          '<div class="analyzing-tag">Result</div>' +
          '<p class="analyzing-copy">Locking in your read.</p>' +
          '<p class="analyzing-next" style="font-size:14px;color:rgba(255,255,255,0.72);max-width:32rem;margin:0 auto 8px;text-align:center;line-height:1.5;">Next: your read on a new page. You can go deeper after with Full Unlock (Notion + archetype report) from there.</p>' +
          '<p class="analyzing-fallback"><a href="' + fallbackHref +
          '" id="analyzing-fallback-link">' + fallbackLabel + '</a></p>' +
          "</section>";
      }, 32);

      /* Only auto-redirect if we have state to read. Otherwise let the
         user choose to restart rather than bouncing them to an empty
         results page. */
      if (!persisted) return;

      var goToResults = function () {
        try { window.location.assign("/results"); }
        catch (eA) { window.location.href = "/results"; }
      };
      window.setTimeout(goToResults, 120);
      window.setTimeout(function () {
        if (/\/capture(?:\.html)?\/?$/.test(window.location.pathname)) {
          goToResults();
        }
      }, 1500);
    }

    renderQuestion();
  </script>
  <script src="/js/stephuary-consent.js" defer></script>
</body>
</html>
