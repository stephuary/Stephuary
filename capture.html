<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stephuary Diagnostic</title>
  <meta name="theme-color" content="#0B1730" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="canonical" href="https://stephuary.com/capture" />
  <meta name="description" content="7 questions. Diagnostic score in under two minutes." />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Stephuary" />
  <meta property="og:title" content="Stephuary Diagnostic" />
  <meta property="og:description" content="7 questions. Diagnostic score in under two minutes." />
  <meta property="og:url" content="https://stephuary.com/capture" />
  <meta property="og:image" content="https://stephuary.com/og-default.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Stephuary Diagnostic" />
  <meta name="twitter:description" content="7 questions. Diagnostic score in under two minutes." />
  <meta name="twitter:image" content="https://stephuary.com/og-default.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/stephuary-motion.css" />
  <style>
    :root {
      --bg: #0a0a1a;
      --surface: rgba(255, 255, 255, 0.04);
      --surface-2: rgba(255, 255, 255, 0.08);
      --line: rgba(255, 255, 255, 0.18);
      --text: #ffffff;
      --text-muted: #c9cad8;
      --gold: #d4b87a;
      --gold-soft: rgba(212, 184, 122, 0.22);
      --ok: #88d39c;
      --danger: #dc2626;
      --max: 40rem;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      color: var(--text);
      background:
        radial-gradient(120% 70% at 20% 0%, rgba(61, 12, 44, 0.28) 0%, transparent 60%),
        radial-gradient(110% 80% at 90% 85%, rgba(61, 12, 44, 0.2) 0%, transparent 58%),
        linear-gradient(180deg, #0a0a1a 0%, #0f0b1c 100%);
      display: grid;
      place-items: center;
      padding: 14px;
    }

    .app {
      width: 100%;
      max-width: var(--max);
      border: 1px solid var(--line);
      background: var(--surface);
      backdrop-filter: blur(6px);
      border-radius: 14px;
      padding: 18px 18px 20px;
      transform: translateY(0);
      opacity: 1;
      transition: opacity 90ms ease, transform 90ms ease;
    }
    .back-home {
      position: fixed;
      top: 16px;
      left: 16px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 8px 12px;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      font-size: 12px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-muted);
      text-decoration: none;
      background: rgba(10, 10, 26, 0.72);
      backdrop-filter: blur(6px);
      transition: color 120ms ease, border-color 120ms ease, background 120ms ease;
    }
    .back-home::before {
      content: "←";
      font-size: 13px;
      line-height: 1;
    }
    .back-home:hover {
      color: var(--text);
      border-color: rgba(200, 169, 110, 0.45);
      background: rgba(200, 169, 110, 0.08);
    }

    .app.is-transitioning {
      opacity: 0.35;
      transform: translateY(4px);
    }

    .capture-layout {
      display: flex;
      flex-direction: column;
      max-width: 36rem;
      margin: 0 auto;
    }

    .capture-progress-meta {
      font-size: 11px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--text-muted);
      font-weight: 600;
      margin-bottom: 8px;
    }

    .capture-progress-track {
      height: 4px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.1);
      overflow: hidden;
      margin-bottom: 14px;
    }

    .capture-progress-fill {
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--gold), #e8d4a8);
      transition: width 0.2s ease;
    }

    .capture-question-zone {
      flex: 1;
      display: flex;
      align-items: center;
      margin: 4px 0 14px;
    }

    .question {
      font-family: "Playfair Display", Georgia, serif;
      font-size: clamp(1.35rem, 4.2vw, 1.85rem);
      font-weight: 700;
      line-height: 1.18;
      margin: 0;
      letter-spacing: -0.02em;
    }

    .answers {
      display: grid;
      gap: 10px;
    }

    .answer-btn {
      width: 100%;
      text-align: left;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.03);
      color: var(--text);
      padding: 16px 18px;
      font-size: 16px;
      font-weight: 600;
      line-height: 1.35;
      cursor: pointer;
      min-height: 56px;
    }

    .answer-btn:hover {
      background: var(--surface-2);
    }

    .answer-btn.is-selected {
      border-color: var(--gold);
      background: var(--gold-soft);
      box-shadow: 0 0 0 1px rgba(212, 184, 122, 0.35);
    }

    .answer-btn.is-locked {
      pointer-events: none;
      opacity: 0.55;
    }

    .feedback {
      margin-top: 14px;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-left: 3px solid var(--gold);
      border-radius: 10px;
      color: var(--text-muted);
      font-size: 14px;
      line-height: 1.5;
      background: rgba(255, 255, 255, 0.02);
      display: none;
    }

    .feedback.is-visible { display: block; }
    .feedback.good { border-left-color: var(--ok); }
    .feedback.warn { border-left-color: var(--danger); }

    .interstitial,
    .analyzing {
      text-align: center;
      padding: 28px 14px;
    }

    .interstitial-tag,
    .analyzing-tag {
      font-size: 11px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 10px;
    }

    .interstitial-copy,
    .analyzing-copy {
      font-family: "Playfair Display", Georgia, serif;
      font-size: clamp(26px, 4vw, 34px);
      line-height: 1.2;
      margin: 0;
      color: var(--text);
    }

    @media (max-width: 768px) {
      .app { padding: 16px 14px 18px; }
      .answers { gap: 8px; }
      .answer-btn {
        padding: 15px 16px;
        min-height: 52px;
      }
      .back-home {
        top: 12px;
        left: 12px;
        padding: 7px 11px;
        font-size: 11px;
      }
    }
  </style>
</head>
<body class="capture-page">
  <a href="/" class="back-home">Homepage</a>
  <main class="app" id="app" aria-live="polite"></main>

  <script>
    const QUESTIONS = [
      {
        id: 1,
        text:
          "Can someone understand what you do, who it's for, and why it's worth the price in under 10 seconds?"
      },
      {
        id: 2,
        text: "At what exact step are your last 3 deals falling apart?"
      },
      {
        id: 3,
        text: "Can a buyer explain why you're the better choice without you being there to explain it?"
      },
      {
        id: 4,
        text: "Do your last 5 leads match the work you want to be paid for?"
      },
      {
        id: 5,
        text: "Is your delivery process the same every time, without needing to figure it out again?"
      },
      {
        id: 6,
        text: "If you step away for a week, does work continue without delays or drop in quality?"
      },
      {
        id: 7,
        text: "Does your price make sense before you explain it?"
      }
    ];

    const ANSWER_ORDER = [
      { key: "yes", label: "Yes" },
      { key: "not_sure", label: "Not sure" },
      { key: "no", label: "No" }
    ];

    const POINTS = { yes: 2, not_sure: 1, no: 0 };

    let currentIndex = 0;
    const answers = [];

    const app = document.getElementById("app");

    function transition(callback, delay) {
      const ms = delay == null ? 165 : delay;
      app.classList.add("is-transitioning");
      window.setTimeout(() => {
        callback();
        app.classList.remove("is-transitioning");
      }, ms);
    }

    function answersById() {
      const m = {};
      answers.forEach(function (a) {
        m[a.id] = a.value;
      });
      return m;
    }

    function resultTypeFromTotal(total) {
      if (total <= 4) return "Breakdown";
      if (total <= 8) return "Misalignment";
      if (total <= 11) return "Constraint";
      return "Ceiling";
    }

    function buildPayload() {
      const byId = answersById();
      const points = answers.map(function (a) {
        return POINTS[a.value];
      });
      const totalScore = points.reduce(function (s, n) {
        return s + n;
      }, 0);
      const resultType = resultTypeFromTotal(totalScore);
      const scores = {
        clarity: [1, 2, 7].filter(function (id) {
          return byId[id] === "no";
        }).length,
        positioning: [3, 4].filter(function (id) {
          return byId[id] === "no";
        }).length,
        structure: [5, 6].filter(function (id) {
          return byId[id] === "no";
        }).length
      };
      return {
        schema: "diag_v2",
        version: 2,
        answers: answers.slice(),
        points: points,
        totalScore: totalScore,
        resultType: resultType,
        scores: scores,
        result: {
          headline: "",
          nextStep: ""
        }
      };
    }

    function renderQuestion() {
      const q = QUESTIONS[currentIndex];
      const n = currentIndex + 1;
      const pct = Math.round((100 * n) / 7);
      const btns = ANSWER_ORDER.map(function (opt) {
        return (
          '<button type="button" class="answer-btn" data-value="' +
          opt.key +
          '">' +
          opt.label +
          "</button>"
        );
      }).join("");
      app.innerHTML =
        '<div class="capture-layout">' +
        '<div>' +
        '<div class="capture-progress-meta">Question ' +
        n +
        " of 7</div>" +
        '<div class="capture-progress-track" aria-hidden="true">' +
        '<div class="capture-progress-fill" style="width:' +
        pct +
        '%"></div></div></div>' +
        '<div class="capture-question-zone"><h1 class="question">' +
        q.text +
        "</h1></div>" +
        '<div class="answers">' +
        btns +
        "</div></div>";
      const layout = app.querySelector(".capture-layout");
      if (layout) {
        layout.classList.remove("sh-motion-q-enter");
        void layout.offsetWidth;
        requestAnimationFrame(function () {
          layout.classList.add("sh-motion-q-enter");
        });
      }

      Array.prototype.forEach.call(app.querySelectorAll(".answer-btn"), function (btn) {
        btn.addEventListener("click", function () {
          if (btn.classList.contains("is-locked")) return;
          const value = btn.getAttribute("data-value");
          Array.prototype.forEach.call(app.querySelectorAll(".answer-btn"), function (b) {
            b.classList.add("is-locked");
            b.classList.remove("is-selected");
          });
          btn.classList.add("is-selected");
          answers.push({ id: q.id, value: value });
          currentIndex++;
          if (currentIndex < QUESTIONS.length) {
            transition(renderQuestion, 32);
          } else {
            renderAnalyzing();
          }
        });
      });
    }

    function renderAnalyzing() {
      transition(function () {
        app.innerHTML =
          '<section class="analyzing">' +
          '<div class="analyzing-tag">Result</div>' +
          '<p class="analyzing-copy">Locking in your read.</p>' +
          "</section>";
      }, 32);
      window.setTimeout(function () {
        const payload = buildPayload();
        try {
          localStorage.setItem("diagnosticResults", JSON.stringify(payload));
        } catch (e) {}
        window.location.href = "/results";
      }, 260);
    }

    renderQuestion();
  </script>
</body>
</html>
