<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stephuary Diagnostic</title>
  <style>
    :root {
      --bg: #0a0a1a;
      --surface: rgba(255, 255, 255, 0.03);
      --surface-2: rgba(255, 255, 255, 0.05);
      --line: rgba(255, 255, 255, 0.12);
      --text: #ffffff;
      --text-muted: #a0a0b0;
      --gold: #c8a96e;
      --gold-soft: rgba(200, 169, 110, 0.18);
      --ok: #88d39c;
      --danger: #ff8a9f;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      color: var(--text);
      background:
        radial-gradient(120% 70% at 20% 0%, rgba(61, 12, 44, 0.28) 0%, transparent 60%),
        radial-gradient(110% 80% at 90% 85%, rgba(61, 12, 44, 0.2) 0%, transparent 58%),
        linear-gradient(180deg, #0a0a1a 0%, #0f0b1c 100%);
      display: grid;
      place-items: center;
      padding: 20px;
    }

    .app {
      width: 100%;
      max-width: 760px;
      border: 1px solid var(--line);
      background: var(--surface);
      backdrop-filter: blur(6px);
      border-radius: 16px;
      padding: 24px;
      transform: translateY(0);
      opacity: 1;
      transition: opacity 240ms ease, transform 240ms ease;
    }

    .app.is-transitioning {
      opacity: 0;
      transform: translateY(10px);
    }

    .progress {
      font-size: 12px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 18px;
    }

    .question {
      font-family: "Playfair Display", Georgia, serif;
      font-size: clamp(28px, 4vw, 40px);
      line-height: 1.15;
      margin: 0 0 20px;
      letter-spacing: -0.01em;
    }

    .answers {
      display: grid;
      gap: 12px;
    }

    .answer-btn {
      width: 100%;
      text-align: left;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--surface);
      color: var(--text);
      padding: 18px 16px;
      font-size: 16px;
      line-height: 1.45;
      cursor: pointer;
      transition: border-color 180ms ease, background 180ms ease, transform 180ms ease;
      min-height: 64px;
    }

    .answer-btn:hover {
      border-color: rgba(200, 169, 110, 0.5);
      background: var(--surface-2);
    }

    .answer-btn:active { transform: translateY(1px); }

    .answer-btn.is-selected {
      border-color: var(--gold);
      background: var(--gold-soft);
    }

    .answer-btn.is-locked { pointer-events: none; opacity: 0.65; }

    .feedback {
      margin-top: 14px;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-left: 3px solid var(--gold);
      border-radius: 10px;
      color: var(--text-muted);
      font-size: 14px;
      line-height: 1.5;
      background: rgba(255, 255, 255, 0.02);
      display: none;
    }

    .feedback.is-visible { display: block; }
    .feedback.good { border-left-color: var(--ok); }
    .feedback.warn { border-left-color: var(--danger); }

    .interstitial,
    .analyzing {
      text-align: center;
      padding: 42px 14px;
    }

    .interstitial-tag,
    .analyzing-tag {
      font-size: 11px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 10px;
    }

    .interstitial-copy,
    .analyzing-copy {
      font-family: "Playfair Display", Georgia, serif;
      font-size: clamp(26px, 4vw, 34px);
      line-height: 1.2;
      margin: 0;
      color: var(--text);
    }

    @media (max-width: 768px) {
      .app { padding: 20px; }
      .answers { gap: 10px; }
      .answer-btn { padding: 16px 14px; }
    }
  </style>
</head>
<body>
  <main class="app" id="app" aria-live="polite"></main>

  <script>
    const questions = [
      {
        id: 1,
        category: "clarity",
        question: "If someone lands on your page right now, would they know what to buy in under 10 seconds?",
        answers: {
          A: {
            text: "Yes, it is obvious what I sell and who it is for",
            feedback: "Clear offers convert faster and require less effort to sell."
          },
          B: {
            text: "No, they would need to read or figure it out",
            feedback: "Most people do not leave because they are not interested. They leave because they do not understand fast enough."
          }
        }
      },
      {
        id: 2,
        category: "clarity",
        question: "Can you explain your offer in one sentence without adding extra context?",
        answers: {
          A: {
            text: "Yes, it is concise and repeatable",
            feedback: "Simple language reduces friction and helps buyers self-qualify."
          },
          B: {
            text: "No, I usually need to explain more",
            feedback: "When explanation is required, trust drops and decision speed slows."
          }
        }
      },
      {
        id: 3,
        category: "positioning",
        question: "Do you clearly differentiate your offer from alternatives your buyer already knows?",
        answers: {
          A: {
            text: "Yes, the difference is obvious and valuable",
            feedback: "Strong positioning gives buyers a reason to choose you now."
          },
          B: {
            text: "No, it sounds similar to other options",
            feedback: "If your offer feels replaceable, price pressure increases and close rates drop."
          }
        }
      },
      {
        id: 4,
        category: "positioning",
        question: "Are you consistently attracting the exact type of buyer you want?",
        answers: {
          A: {
            text: "Yes, most inbound fits my ideal client profile",
            feedback: "Right-fit demand shortens sales cycles and improves retention."
          },
          B: {
            text: "No, I get mixed leads or poor-fit inquiries",
            feedback: "Misaligned demand is usually a positioning problem, not an effort problem."
          }
        }
      },
      {
        id: 5,
        category: "structure",
        question: "After a client says yes, is delivery mapped and repeatable from start to finish?",
        answers: {
          A: {
            text: "Yes, there is a clear system and timeline",
            feedback: "Reliable delivery protects margin and improves client outcomes."
          },
          B: {
            text: "No, it is mostly managed manually each time",
            feedback: "Manual delivery introduces variability and hidden operational drag."
          }
        }
      },
      {
        id: 6,
        category: "structure",
        question: "Could your offer run for a week without you touching every step?",
        answers: {
          A: {
            text: "Yes, core steps continue without bottlenecks",
            feedback: "Operational leverage creates capacity and stabilizes revenue."
          },
          B: {
            text: "No, most steps still depend on me directly",
            feedback: "Founder dependency is a common structural leak in growing businesses."
          }
        }
      },
      {
        id: 7,
        category: "clarity",
        question: "Do your pricing and outcomes feel easy to justify at first glance?",
        answers: {
          A: {
            text: "Yes, the value and price connection is clear",
            feedback: "When price and promise align, conversion resistance decreases."
          },
          B: {
            text: "No, buyers often need extra reassurance",
            feedback: "If value is not instantly legible, objections appear earlier and more often."
          }
        }
      }
    ];

    const patternInterstitials = {
      2: "Early signal: This usually points to a clarity issue, not a traffic issue.",
      4: "Pattern forming: This is starting to look more like a positioning gap.",
      6: "This is typically where most businesses leak time and revenue."
    };

    let currentIndex = 0;
    let answers = [];
    let scores = {
      clarity: 0,
      positioning: 0,
      structure: 0
    };

    const app = document.getElementById("app");

    function getResultSummary() {
      const order = ["clarity", "positioning", "structure"];
      const topCategory = order.reduce((worst, category) => {
        return scores[category] > scores[worst] ? category : worst;
      }, "clarity");

      const topScore = scores[topCategory];
      const balanced = Math.max(scores.clarity, scores.positioning, scores.structure) -
        Math.min(scores.clarity, scores.positioning, scores.structure) <= 1;

      let headline = "Your core friction point is " + topCategory + ".";
      if (balanced && topScore > 0) headline = "Your gaps are distributed across clarity, positioning, and structure.";
      if (topScore === 0) headline = "Your baseline is strong across all three categories.";

      const nextStepByCategory = {
        clarity: "Tighten offer language so a new visitor understands value in under 10 seconds.",
        positioning: "Narrow the buyer frame and sharpen why this offer is the right fit now.",
        structure: "Standardize delivery and remove manual bottlenecks that slow fulfillment."
      };

      return {
        headline,
        topCategory,
        topScore,
        nextStep: topScore === 0
          ? "Keep offer and operations tight; test one conversion lever at a time."
          : nextStepByCategory[topCategory]
      };
    }

    function transition(callback, delay = 220) {
      app.classList.add("is-transitioning");
      window.setTimeout(() => {
        callback();
        app.classList.remove("is-transitioning");
      }, delay);
    }

    function renderQuestion() {
      const q = questions[currentIndex];
      const questionNumber = currentIndex + 1;

      app.innerHTML = `
        <div class="progress">Question ${questionNumber} of 7</div>
        <h1 class="question">${q.question}</h1>
        <div class="answers">
          <button class="answer-btn" data-key="A">${q.answers.A.text}</button>
          <button class="answer-btn" data-key="B">${q.answers.B.text}</button>
        </div>
        <div class="feedback" id="feedback"></div>
      `;

      const buttons = Array.from(app.querySelectorAll(".answer-btn"));
      const feedbackEl = document.getElementById("feedback");

      buttons.forEach((button) => {
        button.addEventListener("click", () => {
          if (button.classList.contains("is-locked")) return;

          const selected = button.dataset.key;
          const category = q.category;
          const selectedAnswer = q.answers[selected];

          buttons.forEach((btn) => {
            btn.classList.add("is-locked");
            btn.classList.remove("is-selected");
          });
          button.classList.add("is-selected");

          if (selected === "B") {
            scores[category]++;
          }

          answers.push({
            id: q.id,
            category: q.category,
            selected,
            answerText: selectedAnswer.text
          });

          feedbackEl.textContent = selectedAnswer.feedback;
          feedbackEl.className = "feedback is-visible " + (selected === "A" ? "good" : "warn");

          window.setTimeout(() => {
            const justAnswered = questionNumber;
            const interstitialMessage = patternInterstitials[justAnswered];

            if (interstitialMessage) {
              renderInterstitial(interstitialMessage);
              return;
            }

            currentIndex++;
            if (currentIndex < questions.length) {
              transition(renderQuestion);
            } else {
              renderAnalyzing();
            }
          }, 800);
        });
      });
    }

    function renderInterstitial(message) {
      transition(() => {
        app.innerHTML = `
          <section class="interstitial">
            <div class="interstitial-tag">Pattern recognition</div>
            <p class="interstitial-copy">${message}</p>
          </section>
        `;
      });

      window.setTimeout(() => {
        currentIndex++;
        if (currentIndex < questions.length) {
          transition(renderQuestion);
        } else {
          renderAnalyzing();
        }
      }, 1200);
    }

    function renderAnalyzing() {
      transition(() => {
        app.innerHTML = `
          <section class="analyzing">
            <div class="analyzing-tag">Finalizing diagnostic</div>
            <p class="analyzing-copy">Analyzing your responses...</p>
          </section>
        `;
      });

      window.setTimeout(() => {
        const result = getResultSummary();
        localStorage.setItem("diagnosticResults", JSON.stringify({
          scores,
          answers,
          result
        }));
        window.location.href = "/results";
      }, 1500);
    }

    renderQuestion();
  </script>
</body>
</html>
