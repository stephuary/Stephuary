<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Confirmed | Stephuary</title>
  <meta name="robots" content="noindex" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400&family=Lato:wght@300;400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #080807;
      --gold: #c4a35a;
      --text: #f4ede0;
      --text-2: #d8d0c4;
      --text-muted: #a89f92;
      --line-2: rgba(244, 237, 224, 0.06);
      --serif: "Cormorant Garamond", Georgia, serif;
      --sans: "Lato", system-ui, sans-serif;
      --max: 520px;
    }
    html, body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      font-weight: 300;
      font-size: 17px;
      line-height: 1.65;
      min-height: 100%;
      -webkit-font-smoothing: antialiased;
    }
    a { color: var(--gold); text-decoration: none; border-bottom: 1px solid rgba(196, 163, 90, 0.25); }
    a:hover { border-bottom-color: rgba(196, 163, 90, 0.5); }
    .page {
      max-width: var(--max);
      margin: 0 auto;
      padding: 56px 24px 80px;
    }
    h1 {
      font-family: var(--serif);
      font-weight: 300;
      font-size: clamp(36px, 6vw, 52px);
      line-height: 1.08;
      letter-spacing: -0.02em;
      margin-bottom: 28px;
    }
    .body-copy p {
      font-size: 17px;
      color: var(--text-2);
      max-width: 42ch;
      margin-bottom: 16px;
    }
    .optional {
      margin-top: 28px;
      font-size: 15px;
      line-height: 1.6;
      color: var(--text-muted);
      max-width: 44ch;
    }
    .foot {
      margin-top: 56px;
      padding-top: 24px;
      border-top: 1px solid var(--line-2);
    }
    .foot a {
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-muted);
      border-bottom: none;
    }
    .foot a:hover { color: var(--text-2); }
  </style>
</head>
<body>
  <div class="page">
    <h1>Confirmed</h1>
    <div class="body-copy">
      <p>Your Snapshot is now in progress.</p>
      <p>You’ll receive your breakdown within 48 hours.</p>
      <p>Check your email for confirmation and next steps.</p>
    </div>
    <p class="optional">If you have any materials you want considered, you can reply directly to the confirmation email.</p>
    <footer class="foot">
      <a href="/">Home</a>
    </footer>
  </div>
</body>
</html>
