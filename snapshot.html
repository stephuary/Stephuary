<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Snapshot | Stephuary</title>
  <meta name="description" content="Snapshot: a focused breakdown tied to your diagnostic. Delivered within 48 hours." />
  <link rel="stylesheet" href="/stephuary-interactive.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Lato:wght@300;400;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #080807;
      --bg-1: #0e0e0c;
      --gold: #c4a35a;
      --gold-line: rgba(196, 163, 90, 0.22);
      --blue: #2b4fd4;
      --blue-hi: #3560e8;
      --text: #f4ede0;
      --text-2: #d8d0c4;
      --text-muted: #a89f92;
      --line: rgba(244, 237, 224, 0.1);
      --line-2: rgba(244, 237, 224, 0.06);
      --serif: "Cormorant Garamond", Georgia, serif;
      --sans: "Lato", system-ui, sans-serif;
      --r: 2px;
      --max: 640px;
    }

    html, body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      font-weight: 300;
      font-size: 17px;
      line-height: 1.65;
      min-height: 100%;
      -webkit-font-smoothing: antialiased;
    }

    a { color: inherit; text-decoration: none; }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 100;
      opacity: 0.022;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      background-size: 200px 200px;
    }

    .page {
      position: relative;
      z-index: 1;
      max-width: var(--max);
      margin: 0 auto;
      padding: 0 24px 120px;
    }

    .top-nav {
      padding: 28px 0 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 56px;
      flex-wrap: wrap;
      gap: 16px;
    }

    .nav-logo {
      font-family: var(--serif);
      font-size: 13px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--gold);
      font-weight: 300;
    }

    .nav-links {
      display: flex;
      gap: 18px 20px;
      align-items: center;
      flex-wrap: wrap;
    }

    .nav-link {
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--text-muted);
      transition: color 150ms;
    }

    .nav-link:hover { color: var(--text-2); }
    .nav-link--club { color: var(--gold); }

    .kicker {
      font-size: 10px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--gold);
      font-weight: 400;
      margin-bottom: 20px;
    }

    .diagnosis-strip {
      font-size: 14px;
      font-weight: 400;
      line-height: 1.5;
      color: var(--text-2);
      padding: 14px 18px;
      border: 1px solid var(--gold-line);
      border-left: 3px solid var(--gold);
      background: rgba(196, 163, 90, 0.06);
      border-radius: var(--r);
      margin-bottom: 36px;
      max-width: 100%;
    }

    .diagnosis-strip--default {
      border-left-color: var(--text-muted);
    }

    h1 {
      font-family: var(--serif);
      font-weight: 300;
      font-size: clamp(36px, 7vw, 58px);
      line-height: 1.06;
      letter-spacing: -0.02em;
      color: var(--text);
      margin-bottom: 18px;
      max-width: 18ch;
    }

    .hero-sub {
      font-size: 17px;
      line-height: 1.6;
      color: var(--text-2);
      max-width: 38ch;
      margin-bottom: 20px;
    }

    .delivery-line {
      font-size: 13px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 56px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .delivery-line::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--gold);
      opacity: 0.5;
      flex-shrink: 0;
    }

    .section { margin-bottom: 64px; }

    .section h2 {
      font-family: var(--serif);
      font-weight: 300;
      font-size: clamp(22px, 3.5vw, 30px);
      line-height: 1.15;
      letter-spacing: -0.01em;
      color: var(--text);
      margin-bottom: 14px;
    }

    .section p,
    .section li {
      font-size: 16px;
      line-height: 1.65;
      color: var(--text-2);
      max-width: 46ch;
    }

    .section p + p { margin-top: 12px; }

    .bullet-list {
      list-style: none;
      margin-top: 16px;
      display: flex;
      flex-direction: column;
      gap: 0;
      border-top: 1px solid var(--line-2);
    }

    .bullet-list li {
      padding: 14px 0 14px 20px;
      border-bottom: 1px solid var(--line-2);
      position: relative;
      max-width: none;
    }

    .bullet-list li::before {
      content: "";
      position: absolute;
      left: 0;
      top: 1.15em;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--gold);
      opacity: 0.45;
    }

    .emphasis-block {
      background: var(--bg-1);
      border: 1px solid var(--line);
      border-top: 2px solid var(--gold);
      border-radius: var(--r);
      padding: 24px 22px;
    }

    .emphasis-block h2 { margin-bottom: 16px; }

    .urgency-block p {
      max-width: 46ch;
    }

    .clarifier {
      font-size: 15px;
      line-height: 1.6;
      color: var(--text-2);
      padding: 20px 0;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      max-width: 46ch;
    }

    .cta-area {
      margin-top: 48px;
    }

    .hero-price {
      display: flex;
      align-items: baseline;
      gap: 10px;
      margin-bottom: 20px;
    }

    .hero-price-val {
      font-family: var(--serif);
      font-size: clamp(30px, 5vw, 44px);
      font-weight: 300;
      color: var(--text);
      letter-spacing: -0.02em;
    }

    .hero-price-note {
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 54px;
      padding: 16px 28px;
      border-radius: var(--r);
      font-size: 11px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      font-family: var(--sans);
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: background 150ms ease, transform 120ms ease;
      text-decoration: none;
      width: 100%;
    }

    .btn:active { transform: scale(0.98); }

    .btn-primary {
      background: var(--blue);
      color: #fff;
    }

    .btn-primary:hover { background: var(--blue-hi); }

    .cta-support {
      margin-top: 16px;
      font-size: 15px;
      line-height: 1.6;
      color: var(--text-2);
      max-width: 44ch;
    }

    .fallback-link {
      display: inline-block;
      margin-top: 22px;
      font-size: 12px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--gold);
      border-bottom: 1px solid transparent;
      padding-bottom: 2px;
      transition: border-color 150ms;
    }

    .fallback-link:hover { border-bottom-color: var(--gold-line); }

    .fallback-link[hidden] { display: none !important; }

    .foot {
      border-top: 1px solid var(--line-2);
      padding-top: 24px;
      margin-top: 72px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px 18px;
    }

    .foot a {
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-muted);
      transition: color 140ms;
    }

    .foot a:hover { color: var(--text-2); }
    .foot a.nav-club { color: var(--gold); }

    @media (max-width: 560px) {
      .page { padding: 0 18px 96px; }
      h1 { max-width: none; }
      .top-nav { margin-bottom: 44px; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="top-nav">
      <a href="/" class="nav-logo">Stephuary</a>
      <nav class="nav-links" aria-label="Primary">
        <a href="/pricing" class="nav-link">Pricing</a>
        <a href="/access" class="nav-link nav-link--club">.5% Club</a>
        <a href="https://stephuary.substack.com" class="nav-link" target="_blank" rel="noopener">Substack</a>
      </nav>
    </header>

    <main id="snapshot-root">
      <p class="kicker">Snapshot</p>
      <p class="diagnosis-strip" id="el-diagnosis" aria-live="polite"></p>
      <h1 id="el-headline"></h1>
      <p class="hero-sub" id="el-subhead"></p>
      <p class="delivery-line">Delivered within 48 hours</p>

      <section class="section" aria-labelledby="meaning-heading">
        <h2 id="meaning-heading">What this usually means</h2>
        <p id="el-meaning"></p>
      </section>

      <section class="section" aria-labelledby="what-you-get-heading">
        <h2 id="what-you-get-heading">What you get</h2>
        <p>In 48 hours, you’ll receive a clear breakdown of:</p>
        <ul class="bullet-list" id="list-what-you-get"></ul>
      </section>

      <section class="section emphasis-block" aria-labelledby="emphasis-heading">
        <h2 id="emphasis-heading"></h2>
        <ul class="bullet-list" id="list-emphasis"></ul>
      </section>

      <section class="section urgency-block" aria-labelledby="urgency-heading">
        <h2 id="urgency-heading">Why this matters now</h2>
        <p id="el-urgency"></p>
      </section>

      <p class="clarifier" id="el-clarifier"></p>

      <section class="cta-area" aria-labelledby="cta-price-label">
        <div class="hero-price" id="cta-price-wrap">
          <span class="hero-price-val" aria-hidden="true">$950</span>
          <span class="hero-price-note" id="cta-price-label">Snapshot</span>
        </div>
        <a class="btn btn-primary" id="el-cta" href="https://checkout.stripe.com/snapshot-placeholder">Get your Snapshot</a>
        <p class="cta-support" id="el-cta-support"></p>
        <a class="fallback-link" id="el-fallback-diagnostic" href="/capture">Start Diagnostic</a>
      </section>
    </main>

    <footer class="foot">
      <a href="/">Home</a>
      <a href="/pricing">Pricing</a>
      <a href="/access" class="nav-club">.5% Club</a>
      <a href="https://stephuary.substack.com" target="_blank" rel="noopener">Substack</a>
    </footer>
  </div>

  <script src="/stephuary-progress.js"></script>
  <script>
(function () {
  /* --- snapshotContent: single source of truth for copy variants --- */
  const snapshotContent = {
    clarity: {
      diagnosisLabel: "Based on your result: Clarity is your current bottleneck",
      headline: "Fix your clarity first. Everything else follows.",
      subhead: "People are seeing your work, but they’re not understanding it fast enough to act.",
      meaning: "The problem is not always the quality of the offer. It’s that the offer is not landing clearly enough for someone to make a decision quickly. When that happens, people hesitate, leave, or tell themselves they’ll come back later.",
      emphasisTitle: "Your Snapshot will show:",
      emphasisBullets: [
        "where your message gets unclear",
        "what people are not understanding fast enough",
        "how to tighten the offer so the next step feels obvious"
      ],
      urgency: "More visibility will not fix a weak landing. If people don’t understand what they’re buying, more traffic just means more missed conversion.",
      ctaSupport: "Get the exact breakdown of what to clarify, what to remove, and what to fix first."
    },
    positioning: {
      diagnosisLabel: "Based on your result: Positioning is your current bottleneck",
      headline: "Your offer is not wrong. It’s aimed wrong.",
      subhead: "The work may be strong. The issue is who it’s reaching, how it’s framed, and what it’s being compared to.",
      meaning: "Positioning problems show up when the right people are not locking in fast enough, while the wrong people keep circling. That usually leads to explaining too much, attracting mixed-fit buyers, and pricing that feels harder to defend than it should.",
      emphasisTitle: "Your Snapshot will show:",
      emphasisBullets: [
        "who the offer is actually strongest for",
        "where the framing is pulling in the wrong buyer",
        "how to reposition without rebuilding everything"
      ],
      urgency: "When positioning is off, even a strong offer feels weaker than it is. You end up competing on personality, trust, or availability instead of fit and value.",
      ctaSupport: "Get the exact breakdown of what to reposition, what to stop saying, and where the offer should actually land."
    },
    structure: {
      diagnosisLabel: "Based on your result: Structure is your current bottleneck",
      headline: "You are doing too much manually. That’s the leak.",
      subhead: "The issue is not just what you sell. It’s what happens before, during, and after someone says yes.",
      meaning: "Structure problems show up when delivery depends too heavily on you each time. That creates hidden friction, inconsistent follow-through, unnecessary labor, and revenue that feels harder to stabilize than it should.",
      emphasisTitle: "Your Snapshot will show:",
      emphasisBullets: [
        "where your process is breaking down",
        "what should be standardized, sequenced, or automated",
        "how to reduce drag without losing quality"
      ],
      urgency: "A business that depends on constant manual adjustment becomes harder to grow, harder to price, and harder to trust at scale.",
      ctaSupport: "Get the exact breakdown of what to systemize, what to simplify, and what to fix first."
    },
    default: {
      diagnosisLabel: "Find the real bottleneck first",
      headline: "Fix the right thing first.",
      subhead: "Snapshot turns your diagnostic into a clear correction plan.",
      meaning: "You’ll get a focused breakdown of what is happening, what it’s costing, and what to fix first.",
      emphasisTitle: "Your Snapshot will show:",
      emphasisBullets: [
        "why the problem is happening",
        "where money or momentum is being lost",
        "what to fix first"
      ],
      urgency: "Most people waste time fixing the wrong layer first.",
      ctaSupport: "Start with the diagnostic for a more precise breakdown."
    }
  };

  const WHAT_YOU_GET_BULLETS = [
    "why this problem is happening",
    "where money or momentum is being lost",
    "what to fix first",
    "what not to touch yet",
    "the cleanest next-step path forward"
  ];

  /* --- localStorage parsing: try keys in priority order, never throw --- */
  function safeParse(raw) {
    if (!raw || typeof raw !== "string") return null;
    try {
      return JSON.parse(raw);
    } catch (e) {
      return null;
    }
  }

  function readDiagnosticResults() {
    try {
      return safeParse(localStorage.getItem("diagnosticResults"));
    } catch (e) {
      return null;
    }
  }

  function readStephuaryResultV1() {
    try {
      return safeParse(localStorage.getItem("stephuary_result_v1"));
    } catch (e) {
      return null;
    }
  }

  function normalizeArea(value) {
    if (!value || typeof value !== "string") return null;
    var v = value.trim().toLowerCase();
    if (v === "clarity" || v === "positioning" || v === "structure") return v;
    return null;
  }

  function bottleneckFromScores(scores) {
    if (!scores || typeof scores !== "object") return null;
    var c = Number(scores.clarity);
    var p = Number(scores.positioning);
    var s = Number(scores.structure);
    if (isNaN(c)) c = 0;
    if (isNaN(p)) p = 0;
    if (isNaN(s)) s = 0;
    var max = Math.max(c, p, s);
    if (max === 0) return null;
    var order = ["clarity", "positioning", "structure"];
    var candidates = order.filter(function (k) {
      return (Number(scores[k]) || 0) === max;
    });
    if (candidates.length === 0) return null;
    if (candidates.length === 1) return candidates[0];
    for (var i = 0; i < order.length; i++) {
      if (candidates.indexOf(order[i]) !== -1) return order[i];
    }
    return null;
  }

  function keywordAreaFromMainProblem(text) {
    if (!text || typeof text !== "string") return null;
    var t = text.toLowerCase();
    if (t.indexOf("clarity") !== -1) return "clarity";
    if (t.indexOf("positioning") !== -1) return "positioning";
    if (t.indexOf("structure") !== -1) return "structure";
    return null;
  }

  /* --- primary issue detection: lowest_area → main_problem keywords → scores → default --- */
  function detectPrimaryIssue() {
    var dr = readDiagnosticResults();
    var legacy = readStephuaryResultV1();

    if (dr && typeof dr === "object") {
      if (dr.result && normalizeArea(dr.result.topCategory)) {
        return normalizeArea(dr.result.topCategory);
      }
      var fromScores = bottleneckFromScores(dr.scores);
      if (fromScores) return fromScores;
      if (dr.diagnostic && typeof dr.diagnostic === "object") {
        var dLow = normalizeArea(dr.diagnostic.lowest_area);
        if (dLow) return dLow;
        var dKw = keywordAreaFromMainProblem(String(dr.diagnostic.main_problem || dr.diagnostic.primary_issue || ""));
        if (dKw) return dKw;
      }
    }

    var diag = null;
    if (legacy && typeof legacy === "object") {
      if (legacy.diagnostic && typeof legacy.diagnostic === "object") {
        diag = legacy.diagnostic;
      } else {
        diag = legacy;
      }
    }

    if (diag) {
      var low = normalizeArea(diag.lowest_area);
      if (low) return low;
      var mp = diag.main_problem || diag.primary_issue || "";
      var kw = keywordAreaFromMainProblem(String(mp));
      if (kw) return kw;
    }

    if (dr && typeof dr === "object" && dr.result && dr.result.headline) {
      var hkw = keywordAreaFromMainProblem(String(dr.result.headline));
      if (hkw) return hkw;
    }

    return "default";
  }

  /* --- content rendering + fallback handling --- */
  function fillList(el, items) {
    if (!el || !items) return;
    el.innerHTML = "";
    items.forEach(function (text) {
      var li = document.createElement("li");
      li.textContent = text;
      el.appendChild(li);
    });
  }

  function render() {
    var key = detectPrimaryIssue();
    if (key !== "clarity" && key !== "positioning" && key !== "structure") {
      key = "default";
    }

    var content = snapshotContent[key] || snapshotContent.default;
    var isDefault = key === "default";

    var elDiagnosis = document.getElementById("el-diagnosis");
    var elHeadline = document.getElementById("el-headline");
    var elSub = document.getElementById("el-subhead");
    var elMeaning = document.getElementById("el-meaning");
    var elEmphasisTitle = document.getElementById("emphasis-heading");
    var elUrgency = document.getElementById("el-urgency");
    var elClarifier = document.getElementById("el-clarifier");
    var elCtaSupport = document.getElementById("el-cta-support");
    var elFallback = document.getElementById("el-fallback-diagnostic");

    if (elDiagnosis) {
      elDiagnosis.textContent = isDefault ? "Find the real bottleneck first" : content.diagnosisLabel;
      elDiagnosis.classList.toggle("diagnosis-strip--default", isDefault);
    }
    if (elHeadline) elHeadline.textContent = content.headline;
    if (elSub) elSub.textContent = content.subhead;
    if (elMeaning) elMeaning.textContent = content.meaning;
    if (elEmphasisTitle) elEmphasisTitle.textContent = content.emphasisTitle;
    if (elUrgency) elUrgency.textContent = content.urgency;
    if (elClarifier) {
      elClarifier.textContent = isDefault
        ? "Start with the diagnostic for a more precise breakdown."
        : "This is not a general audit. It is built directly from your diagnostic result.";
    }
    if (elCtaSupport) elCtaSupport.textContent = content.ctaSupport;
    if (elFallback) {
      if (isDefault) elFallback.removeAttribute("hidden");
      else elFallback.setAttribute("hidden", "");
    }

    fillList(document.getElementById("list-what-you-get"), WHAT_YOU_GET_BULLETS);
    fillList(document.getElementById("list-emphasis"), content.emphasisBullets || []);
  }

  render();

  var elRestart = document.getElementById("snap-nav-restart");
  if (elRestart) {
    elRestart.addEventListener("click", function (e) {
      e.preventDefault();
      if (window.StephuaryProgress) window.StephuaryProgress.confirmRestart();
    });
  }
})();
  </script>
  <script src="/stephuary-interactive.js" defer></script>
</body>
</html>
