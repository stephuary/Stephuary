<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Report · Stephuary</title>
  <meta name="description" content="Stephuary report." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0a0a0a;
      --text: #e8e6e3;
      --muted: #9a9690;
      --rule: rgba(232, 230, 227, 0.12);
      --font: "Inter", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      font-size: 16px;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }
    main {
      width: min(40rem, 100% - 2rem);
      margin: 0 auto;
      padding: 2.5rem 0 3rem;
    }
    .lede {
      margin: 0 0 1.75rem;
      font-size: 1.05rem;
    }
    section {
      margin: 0 0 1.75rem;
      padding: 0 0 1.75rem;
      border-bottom: 1px solid var(--rule);
    }
    section:last-of-type {
      border-bottom: 0;
      padding-bottom: 0;
      margin-bottom: 0;
    }
    h2 {
      margin: 0 0 0.65rem;
      font-size: 1rem;
      font-weight: 600;
      color: var(--text);
    }
    p {
      margin: 0 0 0.65rem;
      max-width: 36rem;
    }
    p:last-child {
      margin-bottom: 0;
    }
    ul {
      margin: 0;
      padding: 0;
      list-style: none;
      max-width: 36rem;
    }
    li {
      position: relative;
      padding-left: 1rem;
      margin-bottom: 0.4rem;
    }
    li::before {
      content: "–";
      position: absolute;
      left: 0;
      color: var(--muted);
    }
    li:last-child {
      margin-bottom: 0;
    }
    .block-lines p {
      margin-bottom: 0.5rem;
    }
    .leverage-gap {
      margin: 0.75rem 0 0.5rem;
    }
    .foot {
      margin-top: 2rem;
      font-size: 0.875rem;
    }
    .foot a {
      color: var(--muted);
      text-decoration: underline;
      text-underline-offset: 3px;
    }
    .foot a:hover {
      color: var(--text);
    }
  </style>
</head>
<body>
  <main id="report-root"></main>
  <script>
    var REPORT = {
      lede: 'This pattern shows up when interest is high and decisions slow when price comes up.',
      signs: [
        'You lowered your price to close',
        'Buyers ask how this is different',
        'Proposals stall after agreement',
        "You've rewritten your offer multiple times",
        "Testimonials don't separate you",
        "Calls don't convert consistently",
        'Pricing comes up before value is clear'
      ],
      dealsLead: 'The drop happened when the buyer tried to explain your offer to themselves.',
      dealsRest: ['Your positioning had to carry the decision.', "It didn't."],
      costing: ['Deals that were close', 'Time spent explaining', 'Lower pricing', 'Inconsistent revenue'],
      rootCause: 'Your offer depends on explanation.',
      leverageIntro: 'Your offer needs to answer:',
      leverageQuestion: 'Why this',
      leverageClose: 'That answer needs to be immediate.',
      weekIntro: "Rewrite your offer so it's clear in under 10 seconds:",
      weekBullets: ["What it is", "Who it's for", 'Why it wins']
    };

    function esc(s) {
      if (s == null) return '';
      var d = document.createElement('div');
      d.textContent = String(s);
      return d.innerHTML;
    }

    function renderReport() {
      var d = REPORT;
      var signs = d.signs
        .map(function (line) {
          return '<li>' + esc(line) + '</li>';
        })
        .join('');
      var dealsParas =
        '<p>' + esc(d.dealsLead) + '</p>' +
        d.dealsRest
          .map(function (line) {
            return '<p>' + esc(line) + '</p>';
          })
          .join('');
      var costing = d.costing
        .map(function (line) {
          return '<li>' + esc(line) + '</li>';
        })
        .join('');
      var week = d.weekBullets
        .map(function (line) {
          return '<li>' + esc(line) + '</li>';
        })
        .join('');

      var root = document.getElementById('report-root');
      root.innerHTML =
        '<p class="lede">' + esc(d.lede) + '</p>' +
        '<section><h2>All 7 signs</h2><ul>' + signs + '</ul></section>' +
        '<section><h2>Where your last 3 deals broke</h2><div class="block-lines">' + dealsParas + '</div></section>' +
        '<section><h2>What this is costing</h2><ul>' + costing + '</ul></section>' +
        '<section><h2>Root cause</h2><p>' + esc(d.rootCause) + '</p></section>' +
        '<section><h2>Leverage point</h2><p>' + esc(d.leverageIntro) + '</p>' +
        '<p class="leverage-gap">' + esc(d.leverageQuestion) + '</p>' +
        '<p>' + esc(d.leverageClose) + '</p></section>' +
        '<section><h2>What to do this week</h2><p>' + esc(d.weekIntro) + '</p><ul>' + week + '</ul></section>' +
        '<p class="foot"><a href="/">Home</a></p>';
    }

    renderReport();
  </script>
</body>
</html>
