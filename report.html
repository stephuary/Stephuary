<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Report · Stephuary</title>
  <meta name="description" content="Stephuary diagnostic report." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0a0a0a;
      --text: #f2f0ec;
      --muted: #b8b4ab;
      --line: rgba(242, 240, 236, 0.14);
      --sticky-bg: rgba(10, 10, 10, 0.92);
      --accent: #c4a35a;
      --cta: #2b4fd4;
      --max: 40rem;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, system-ui, sans-serif;
      font-size: 15px;
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
    }
    .report-sticky {
      position: sticky;
      top: 0;
      z-index: 20;
      background: var(--sticky-bg);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--line);
      padding: 0.85rem 1rem 1rem;
    }
    .report-sticky-inner {
      max-width: var(--max);
      margin: 0 auto;
    }
    .report-title {
      font-size: 0.68rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 0 0 0.35rem;
      font-weight: 600;
    }
    .report-sticky h1 {
      font-size: 1.05rem;
      font-weight: 700;
      margin: 0 0 0.4rem;
      letter-spacing: -0.02em;
    }
    .report-pattern {
      font-size: 0.92rem;
      color: var(--text);
      margin: 0 0 0.75rem;
      max-width: 36rem;
      line-height: 1.4;
    }
    .report-cta-pri {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 22rem;
      padding: 0.85rem 1rem;
      background: var(--cta);
      color: #fff;
      font-weight: 700;
      font-size: 0.72rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      text-decoration: none;
      border: 1px solid rgba(255, 255, 255, 0.12);
    }
    .report-cta-pri:hover {
      filter: brightness(1.06);
    }
    .report-main {
      max-width: var(--max);
      margin: 0 auto;
      padding: 0.5rem 1rem 2.5rem;
    }
    .report-acc {
      border-top: 1px solid var(--line);
    }
    .report-acc-item {
      border-bottom: 1px solid var(--line);
    }
    .report-acc-item--costing .report-acc-trigger {
      font-size: 0.98rem;
    }
    .report-acc-trigger {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      padding: 0.65rem 0;
      border: 0;
      background: transparent;
      color: var(--text);
      font: inherit;
      font-weight: 700;
      font-size: 0.88rem;
      text-align: left;
      cursor: pointer;
    }
    .report-acc-trigger:focus-visible {
      outline: 2px solid var(--cta);
      outline-offset: 2px;
    }
    .report-acc-icon {
      flex-shrink: 0;
      font-size: 0.75rem;
      color: var(--muted);
      transition: transform 0.2s ease;
    }
    .report-acc-item.is-open .report-acc-icon {
      transform: rotate(180deg);
    }
    .report-acc-panel {
      max-height: 0;
      overflow: hidden;
      opacity: 0;
      transition: max-height 0.28s ease, opacity 0.2s ease;
    }
    .report-acc-item.is-open .report-acc-panel {
      opacity: 1;
    }
    .report-acc-panel-inner {
      padding: 0 0 0.65rem;
      font-size: 0.9rem;
      color: var(--muted);
    }
    .report-acc-item--costing .report-acc-panel-inner {
      font-size: 0.95rem;
      color: var(--text);
      background: rgba(196, 163, 90, 0.08);
      border: 1px solid rgba(196, 163, 90, 0.28);
      padding: 0.75rem 0.85rem;
      margin-bottom: 0.35rem;
    }
    .report-acc-panel-inner p {
      margin: 0 0 0.45rem;
      max-width: none;
    }
    .report-acc-panel-inner p:last-child {
      margin-bottom: 0;
    }
    .report-acc-panel-inner ul {
      margin: 0;
      padding: 0;
      list-style: none;
    }
    .report-acc-panel-inner li {
      position: relative;
      padding-left: 0.85rem;
      margin-bottom: 0.3rem;
    }
    .report-acc-panel-inner li::before {
      content: "–";
      position: absolute;
      left: 0;
      color: var(--muted);
    }
    .foot {
      max-width: var(--max);
      margin: 1.5rem auto 0;
      padding: 0 1rem 2rem;
      font-size: 0.85rem;
    }
    .foot a {
      color: var(--muted);
    }
  </style>
</head>
<body>
  <header class="report-sticky">
    <div class="report-sticky-inner">
      <p class="report-title">Report</p>
      <h1 id="report-pattern-head">Your pattern</h1>
      <p class="report-pattern" id="report-pattern-body"></p>
      <a class="report-cta-pri" id="report-sticky-cta" href="#">Get full report $27</a>
    </div>
  </header>

  <main class="report-main">
    <div class="report-acc" id="report-acc-root" aria-label="Report sections"></div>
  </main>
  <p class="foot"><a href="/">Home</a> · <a href="/content-system">Voice to content</a></p>

  <script>
    var STRIPE_FULL_REPORT_27 = 'https://buy.stripe.com/00wcN500E5imd5WeWv33W03';

    function esc(s) {
      if (s == null) return '';
      var d = document.createElement('div');
      d.textContent = String(s);
      return d.innerHTML;
    }

    var REPORT = {
      patternTitle: 'Your pattern',
      patternBody: 'Interest is not the issue. Decisions slow when price comes up.',
      sections: [
        {
          key: 'signs',
          title: 'All 7 signs',
          html:
            '<ul>' +
            [
              'You lowered your price to close',
              'Buyers ask how this is different',
              'Proposals stall after agreement',
              "You've rewritten your offer multiple times",
              "Testimonials don't separate you",
              "Calls don't convert consistently",
              'Pricing comes up before value is clear'
            ]
              .map(function (t) {
                return '<li>' + esc(t) + '</li>';
              })
              .join('') +
            '</ul>'
        },
        {
          key: 'deals',
          title: 'Where your last 3 deals broke',
          html:
            '<p>The drop happened when the buyer tried to explain your offer to themselves.</p>' +
            '<p>This is where they compare, justify, and decide.</p>' +
            '<p>Your positioning had to carry that decision.</p>' +
            "<p>It didn't.</p>"
        },
        {
          key: 'costing',
          title: 'What this is costing',
          costing: true,
          html:
            '<ul>' +
            ['2-5 lost deals per month', '$2K-$10K per deal', '10-20 hours lost monthly']
              .map(function (t) {
                return '<li>' + esc(t) + '</li>';
              })
              .join('') +
            '</ul>' +
            '<p style="margin-top:0.55rem"><strong>Estimated impact:</strong> $4K-$30K/month</p>'
        },
        {
          key: 'why',
          title: "Why it's happening",
          html:
            '<p>Your offer requires explanation.</p>' +
            '<p>Buyers cannot understand or justify it quickly.</p>' +
            '<p>That delay slows decisions.</p>'
        },
        {
          key: 'sale',
          title: "What's happening in the sale",
          html:
            '<ul>' +
            [
              'Interest builds',
              'Conversation is strong',
              'Price enters',
              'Buyer pauses',
              'Comparison starts',
              'Decision slows'
            ]
              .map(function (t) {
                return '<li>' + esc(t) + '</li>';
              })
              .join('') +
            '</ul>' +
            '<p style="margin-top:0.5rem">Loss happens at the pause.</p>'
        },
        {
          key: 'leverage',
          title: 'Leverage point',
          html:
            '<p>Your offer must answer:</p>' +
            '<p><strong>Why this</strong></p>' +
            '<p>Immediately.</p>'
        },
        {
          key: 'week',
          title: 'What to do this week',
          html:
            '<p>Write your offer in one sentence:</p>' +
            '<ul>' +
            ['What it is', "Who it's for", 'What result it creates']
              .map(function (t) {
                return '<li>' + esc(t) + '</li>';
              })
              .join('') +
            '</ul>' +
            '<p>Remove any step where explanation is needed.</p>' +
            '<p>Add one line that anchors comparison.</p>'
        },
        {
          key: 'fixed',
          title: 'What changes when fixed',
          html:
            '<ul>' +
            ['Faster decisions', 'Fewer objections', 'Higher close rate', 'Less time explaining']
              .map(function (t) {
                return '<li>' + esc(t) + '</li>';
              })
              .join('') +
            '</ul>' +
            '<p style="margin-top:0.5rem">10-20% lift = $2K-$15K/month</p>'
        },
        {
          key: 'notfix',
          title: 'What this does not fix',
          html:
            '<ul>' +
            ['Delivery structure', 'Scaling', 'Dependency']
              .map(function (t) {
                return '<li>' + esc(t) + '</li>';
              })
              .join('') +
            '</ul>'
        }
      ]
    };

    function renderReport() {
      document.getElementById('report-pattern-head').textContent = REPORT.patternTitle;
      document.getElementById('report-pattern-body').textContent = REPORT.patternBody;
      var cta = document.getElementById('report-sticky-cta');
      cta.setAttribute('href', STRIPE_FULL_REPORT_27);

      var root = document.getElementById('report-acc-root');
      root.innerHTML = REPORT.sections
        .map(function (sec) {
          var extra = sec.costing ? ' report-acc-item--costing' : '';
          return (
            '<article class="report-acc-item' +
            extra +
            '" data-rpt-item>' +
            '<button type="button" class="report-acc-trigger" data-rpt-trigger aria-expanded="false">' +
            '<span>' +
            esc(sec.title) +
            '</span><span class="report-acc-icon" aria-hidden="true">▾</span>' +
            '</button>' +
            '<div class="report-acc-panel" data-rpt-panel><div class="report-acc-panel-inner">' +
            sec.html +
            '</div></div>' +
            '</article>'
          );
        })
        .join('');

      initReportAccordions();
    }

    function initReportAccordions() {
      var root = document.getElementById('report-acc-root');
      if (!root) return;
      var items = Array.prototype.slice.call(root.querySelectorAll('[data-rpt-item]'));

      function closeAll() {
        items.forEach(function (item) {
          item.classList.remove('is-open');
          var tr = item.querySelector('[data-rpt-trigger]');
          var panel = item.querySelector('[data-rpt-panel]');
          if (tr) tr.setAttribute('aria-expanded', 'false');
          if (panel) {
            panel.style.maxHeight = '0px';
            panel.style.opacity = '0';
          }
        });
      }

      items.forEach(function (item) {
        var tr = item.querySelector('[data-rpt-trigger]');
        var panel = item.querySelector('[data-rpt-panel]');
        if (!tr || !panel) return;
        tr.addEventListener('click', function () {
          var willOpen = !item.classList.contains('is-open');
          closeAll();
          if (willOpen) {
            item.classList.add('is-open');
            tr.setAttribute('aria-expanded', 'true');
            var inner = panel.querySelector('.report-acc-panel-inner');
            var h = inner ? inner.scrollHeight + 24 : panel.scrollHeight;
            panel.style.maxHeight = h + 'px';
            panel.style.opacity = '1';
          }
        });
      });
    }

    renderReport();
  </script>
</body>
</html>
