<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Room 2 · What you can sell · Stephuary</title>
  <link rel="stylesheet" href="/stephuary-interactive.css" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400&family=DM+Mono:wght@300;400&family=Lato:wght@300;400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/stephuary-rooms-v2.css" />
</head>
<body class="rv2-body">
  <div class="rv2-top">
    <a href="/playbooks">← Playbooks</a>
    <a href="/room-losing">Room 1</a>
  </div>
  <div class="rv2-app" id="rv2-app"></div>
  <script>
(function () {
  var KEY = 'stephuary_room_v2_sell';
  var KEY_R1 = 'stephuary_room_v2_losing';

  var RECALL = [
    { id: 'asked_help', label: 'Someone asked for help' },
    { id: 'advice', label: 'Someone asked me for advice' },
    { id: 'fixed_free', label: 'I fixed something for free' },
    { id: 'rewrote', label: 'I rewrote or reviewed something' },
    { id: 'solved_fast', label: 'I solved something fast' },
    { id: 'good_at', label: 'Someone said I’m good at this' },
    { id: 'explained', label: 'I’ve explained this more than once' },
    { id: 'better', label: 'I already know how to do this better than the typical approach' }
  ];

  var ANCHORS = [
    { id: 'a297', label: '$297 · tight scope, fast', v: 297 },
    { id: 'a750', label: '$750 · standard project', v: 750 },
    { id: 'a1500', label: '$1,500 · deeper engagement', v: 1500 }
  ];

  var state = {
    screen: 0,
    recall_selections: [],
    draft_offer: '',
    lead_price: 0,
    offer_sentence: '',
    price: 0,
    price_locked: false,
    contacts: [],
    first_contact: '',
    message_text: '',
    message_sent: false,
    room1_monthly_loss: 0,
    completed: false,
    timestamp: ''
  };

  function $(s) {
    return document.querySelector(s);
  }
  function save() {
    try {
      state.timestamp = new Date().toISOString();
      localStorage.setItem(KEY, JSON.stringify(state));
    } catch (e) {}
  }
  function load() {
    try {
      var r = localStorage.getItem(KEY);
      if (r) {
        var d = JSON.parse(r);
        Object.keys(state).forEach(function (k) {
          if (d[k] != null) state[k] = d[k];
        });
      }
    } catch (e) {}
    try {
      var r1 = localStorage.getItem(KEY_R1);
      if (r1) {
        var j = JSON.parse(r1);
        if (typeof j.monthly_loss === 'number') state.room1_monthly_loss = j.monthly_loss;
      }
    } catch (e2) {}
  }

  function show(n) {
    state.screen = n;
    save();
    render();
  }

  function draftFromRecall(ids) {
    var labels = RECALL.filter(function (x) {
      return ids.indexOf(x.id) >= 0;
    }).map(function (x) {
      return x.label;
    });
    if (!labels.length) return 'Focused help where people already pull on you.';
    return 'You help with: ' + labels.slice(0, 3).join('; ') + '.';
  }

  function estPrice(ids) {
    var n = ids.length;
    return Math.min(1497, 297 + n * 80);
  }

  function buildMessage() {
    return (
      'Hi ' +
      (state.first_contact || 'there') +
      ',\n\n' +
      '1) You mentioned needing help with this kind of work.\n' +
      '2) I’ll deliver: ' +
      (state.offer_sentence || state.draft_offer) +
      '\n' +
      '3) Timeline: 5–7 business days from payment.\n' +
      '4) Price: $' +
      state.price +
      '\n' +
      '5) Payment: invoice or link I’ll send on yes.\n' +
      '6) Reply yes if you want me to hold the slot.\n\n' +
      '—'
    );
  }

  function render() {
    var app = $('#rv2-app');
    var mloss = state.room1_monthly_loss;
    var r1line =
      mloss > 0
        ? '<p class="rv2-lead">You’re losing $' +
          mloss.toLocaleString() +
          '/month. Here’s where you make some of it back.</p>'
        : '';

    if (state.screen === 0) {
      app.innerHTML =
        '<section class="rv2-screen is-active">' +
        '<p class="rv2-kicker">Room 2 · What you can sell</p>' +
        '<p class="rv2-lead">One offer. One price. One message. Sent before you leave this room.</p>' +
        r1line +
        '<div class="rv2-scope">This room only: define the offer, set the price, write the message, send it. No time tracking, calendar work, or AI setup.</div>' +
        '<button type="button" class="rv2-btn" id="go">Begin</button></section>';
      $('#go').onclick = function () {
        show(1);
      };
      return;
    }

    if (state.screen === 1) {
      var checks = RECALL.map(function (x) {
        return (
          '<label class="rv2-check"><input type="checkbox" data-id="' +
          x.id +
          '"' +
          (state.recall_selections.indexOf(x.id) >= 0 ? ' checked' : '') +
          ' /><span>' +
          x.label +
          '</span></label>'
        );
      }).join('');
      state.draft_offer = draftFromRecall(state.recall_selections);
      state.lead_price = estPrice(state.recall_selections);
      app.innerHTML =
        '<section class="rv2-screen is-active"><p class="rv2-kicker">Start with what already happened</p>' +
        '<h1 class="rv2-h1">What people already ask you for</h1>' +
        '<p class="rv2-lead">Demand shows up as behavior. Check what’s true.</p>' +
        '<div id="rc">' +
        checks +
        '</div>' +
        '<p class="rv2-lead" style="margin-top:16px">Draft offer: ' +
        state.draft_offer +
        '</p>' +
        '<p class="rv2-lead">Lead price: $' +
        state.lead_price +
        ' (estimate)</p>' +
        '<button type="button" class="rv2-btn" id="n1">Continue</button></section>';
      $('#rc').querySelectorAll('input').forEach(function (inp) {
        inp.onchange = function () {
          var ids = [];
          $('#rc').querySelectorAll('input:checked').forEach(function (c) {
            ids.push(c.getAttribute('data-id'));
          });
          state.recall_selections = ids;
          state.draft_offer = draftFromRecall(ids);
          state.lead_price = estPrice(ids);
          save();
          render();
        };
      });
      $('#n1').onclick = function () {
        if (state.recall_selections.length < 1) return;
        show(2);
      };
      return;
    }

    if (state.screen === 2) {
      app.innerHTML =
        '<section class="rv2-screen is-active"><p class="rv2-kicker">One sentence</p>' +
        '<h1 class="rv2-h1">Say it in one line</h1>' +
        '<p class="rv2-lead">If you need a paragraph, you don’t understand the offer yet.</p>' +
        '<p class="rv2-lead">From your recall: ' +
        state.draft_offer +
        '</p>' +
        '<label class="rv2-select-label">I help [person] with [specific problem]</label>' +
        '<textarea class="rv2-textarea" id="sent">' +
        (state.offer_sentence || '') +
        '</textarea>' +
        '<p class="rv2-err" id="e2" hidden>Use: I help [who] with [what] — at least 8 characters.</p>' +
        '<button type="button" class="rv2-btn" id="n2">Continue</button></section>';
      $('#n2').onclick = function () {
        var v = ($('#sent').value || '').trim();
        var okSentence = /i\s+help\s+.+\s+with\s+.+/i.test(v);
        if (v.length < 8 || !okSentence) {
          $('#e2').hidden = false;
          return;
        }
        state.offer_sentence = v;
        save();
        show(3);
      };
      return;
    }

    if (state.screen === 3) {
      var rad = ANCHORS.map(function (a) {
        return (
          '<label class="rv2-check"><input type="radio" name="pr" value="' +
          a.v +
          '"' +
          (state.price === a.v ? ' checked' : '') +
          ' />' +
          a.label +
          '</label>'
        );
      }).join('');
      app.innerHTML =
        '<section class="rv2-screen is-active"><p class="rv2-kicker">Set a real number</p>' +
        '<h1 class="rv2-h1">Set a real number</h1>' +
        '<p class="rv2-lead">A price you won’t say out loud is a price you won’t collect.</p>' +
        '<div class="rv2-radio-row">' +
        rad +
        '</div>' +
        '<label class="rv2-select-label">Or enter your number</label>' +
        '<input type="number" class="rv2-input" id="cust" min="0" placeholder="$" value="' +
        (state.price && !ANCHORS.some(function (a) {
          return a.v === state.price;
        })
          ? state.price
          : '') +
        '" />' +
        '<button type="button" class="rv2-btn" id="lock">Lock the number</button>' +
        '<div id="bigp" class="rv2-big-num" style="display:' +
        (state.price_locked ? 'block' : 'none') +
        '">$' +
        state.price +
        '</div>' +
        '<p class="rv2-lead" id="plock" style="display:' +
        (state.price_locked ? 'block' : 'none') +
        '">This is the number you use.</p>' +
        '<button type="button" class="rv2-btn" id="n3" ' +
        (state.price_locked ? '' : 'disabled') +
        '>Continue</button></section>';
      $('#lock').onclick = function () {
        var c = ($('#cust').value || '').trim();
        var sel = document.querySelector('input[name=pr]:checked');
        var p = c ? parseInt(c, 10) : sel ? parseInt(sel.value, 10) : NaN;
        if (!p || p < 1) return;
        state.price = p;
        state.price_locked = true;
        save();
        show(3);
      };
      $('#n3').onclick = function () {
        show(4);
      };
      return;
    }

    if (state.screen === 4) {
      state.message_text = state.message_text || buildMessage();
      app.innerHTML =
        '<section class="rv2-screen is-active"><p class="rv2-kicker">Start with someone real</p>' +
        '<h1 class="rv2-h1">Name the person and send the message</h1>' +
        '<label class="rv2-select-label">Name 1 (required)</label>' +
        '<input class="rv2-input" id="n1a" value="' +
        (state.contacts[0] || '') +
        '" />' +
        '<label class="rv2-select-label">Name 2 (optional)</label>' +
        '<input class="rv2-input" id="n2a" value="' +
        (state.contacts[1] || '') +
        '" />' +
        '<label class="rv2-select-label">Name 3 (optional)</label>' +
        '<input class="rv2-input" id="n3a" value="' +
        (state.contacts[2] || '') +
        '" />' +
        '<p class="rv2-lead" id="fc"></p>' +
        '<h2 class="rv2-h1" style="font-size:20px;margin-top:20px">Send this</h2>' +
        '<textarea class="rv2-textarea" id="msg">' +
        state.message_text +
        '</textarea>' +
        '<button type="button" class="rv2-btn rv2-btn--ghost" id="cpy">Copy message</button>' +
        '<label class="rv2-check"><input type="checkbox" id="msent" ' +
        (state.message_sent ? 'checked' : '') +
        ' /> Mark as sent (required to continue)</label>' +
        '<p class="rv2-err" id="e4" hidden>Copy, send, then mark sent.</p>' +
        '<button type="button" class="rv2-btn" id="n4">Continue</button></section>';
      function syncFC() {
        var a = ($('#n1a').value || '').trim();
        state.first_contact = a;
        state.contacts = [a, ($('#n2a').value || '').trim(), ($('#n3a').value || '').trim()].filter(Boolean);
        $('#fc').textContent = a ? 'First contact: ' + a + '. Start here.' : '';
        state.message_text = $('#msg').value;
        save();
      }
      $('#n1a').oninput = syncFC;
      $('#n2a').oninput = syncFC;
      $('#n3a').oninput = syncFC;
      $('#msg').oninput = syncFC;
      syncFC();
      $('#cpy').onclick = function () {
        navigator.clipboard.writeText($('#msg').value);
      };
      $('#n4').onclick = function () {
        if (!state.first_contact) return;
        if (!$('#msent').checked) {
          $('#e4').hidden = false;
          return;
        }
        state.message_sent = true;
        state.message_text = $('#msg').value;
        save();
        show(5);
      };
      return;
    }

    if (state.screen === 5) {
      var sentLine =
        state.message_sent && state.first_contact
          ? '<p class="rv2-lead">Sent to ' +
            state.first_contact +
            ' at $' +
            state.price +
            '.</p>'
          : '';
      app.innerHTML =
        '<section class="rv2-screen is-active"><p class="rv2-kicker">Sent. Now what.</p>' +
        '<h1 class="rv2-h1">What happens next</h1>' +
        sentLine +
        '<p class="rv2-lead">1. If they reply yes: send scope, price, and timeline in one message.</p>' +
        '<p class="rv2-lead">2. If they go quiet: follow up once with a single line.</p>' +
        '<p class="rv2-lead">3. If they say no: send the same message to Name 2.</p>' +
        '<div class="rv2-fork">' +
        '<a class="rv2-btn" href="/room-protect">Continue to Room 3</a>' +
        '<a class="rv2-btn rv2-btn--pri" href="/focused-review">I need help landing this → Focused Review · $179</a>' +
        '</div>' +
        '<p class="rv2-note"><a href="/snapshot">Snapshot · $750</a> — full read, priority order, 48 hours.</p>' +
        '<button type="button" class="rv2-btn rv2-btn--ghost" id="tos6">Summary →</button></section>';
      $('#tos6').onclick = function () {
        show(6);
      };
      return;
    }

    if (state.screen === 6) {
      app.innerHTML =
        '<section class="rv2-screen is-active"><p class="rv2-kicker">Your Transaction Record</p>' +
        '<h1 class="rv2-h1">Summary</h1>' +
        '<div class="rv2-summary-block">' +
        'Offer: ' +
        state.offer_sentence +
        '\nPrice: $' +
        state.price +
        '\nFirst contact: ' +
        state.first_contact +
        '\nMessage: ' +
        (state.message_sent ? 'sent' : 'not sent') +
        '\nDate: ' +
        new Date().toLocaleDateString() +
        '</div>' +
        '<p class="rv2-note">The loop: Offer → message → yes → scope/price → pay → deliver → next name.</p>' +
        '<div class="rv2-actions-row">' +
        '<button type="button" class="rv2-btn rv2-btn--ghost" id="cp">Copy summary</button>' +
        '<button type="button" class="rv2-btn rv2-btn--ghost" id="cpm">Copy message</button>' +
        '</div>' +
        '<a class="rv2-btn" href="/room-protect">Continue to Room 3</a>' +
        '<a class="rv2-btn rv2-btn--ghost" href="/">Home</a>' +
        '<p class="rv2-note">Revenue is sent messages. Not smarter ideas.</p></section>';
      state.completed = true;
      save();
      $('#cp').onclick = function () {
        navigator.clipboard.writeText(document.querySelector('.rv2-summary-block').textContent);
      };
      $('#cpm').onclick = function () {
        navigator.clipboard.writeText(state.message_text || buildMessage());
      };
      return;
    }

    app.innerHTML =
      '<section class="rv2-screen is-active"><p class="rv2-lead">Unknown step. <a href="/playbooks">Playbooks</a></p></section>';
  }

  load();
  render();
  var GUIDED_HASH = { 'buyer-problem': 1, 'offer-line': 2, 'price-posture': 3, 'outcome-clarity': 2 };
  function stepFromHash() {
    var slug = (location.hash || '').replace(/^#/, '');
    return slug && Object.prototype.hasOwnProperty.call(GUIDED_HASH, slug) ? GUIDED_HASH[slug] : null;
  }
  var gh = stepFromHash();
  if (gh != null) show(gh);
  window.addEventListener('hashchange', function () {
    var g = stepFromHash();
    if (g != null) show(g);
  });
})();
  </script>
</body>
</html>
